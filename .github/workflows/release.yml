# Builds the Light CMS download whenever a version tag (such as v1.0.0) is pushed.
# Tags with a hyphen (such as v0.1.0-alpha) are published as pre-releases.
#
# The zip holds everything a site needs, including the vendor folder, so a site
# owner only has to unzip it and upload it. Tests run first, so a release is
# never built from broken code. Developer files are left out by the
# export-ignore lines in .gitattributes.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, intl, openssl, fileinfo, dom, xmlreader
          coverage: none

      - name: Run the tests
        run: |
          cp .env.example .env
          composer install --no-interaction --no-progress --prefer-dist
          php artisan key:generate
          php artisan test

      # Stops the release if any package the site ships with has a known security
      # problem. Abandoned packages are only reported, so they don't block a release.
      - name: Check packages for known security problems
        run: composer audit --no-dev --abandoned=report

      - name: Build the site folder
        run: |
          mkdir build
          git archive --format=tar --prefix=light-cms/ "$GITHUB_REF_NAME" | tar -x -C build
          cd build/light-cms
          echo "$GITHUB_REF_NAME" > VERSION
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Zip it
        run: |
          cd build
          zip -qr "../light-cms-$GITHUB_REF_NAME.zip" light-cms

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a hyphen (v0.1.0-alpha, v1.0.0-rc1) is a test build, published
          # as a pre-release; a plain version (v1.0.0) becomes the latest release.
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease="--prerelease"
          fi

          # GitHub also lists "Source code" downloads on every release, which lack the
          # vendor folder and can't run without Composer, so the notes say which to use.
          gh release create "$GITHUB_REF_NAME" "light-cms-$GITHUB_REF_NAME.zip" \
            --title "Light CMS $GITHUB_REF_NAME" \
            --notes "**Download light-cms-$GITHUB_REF_NAME.zip below, not the Source code files.** It includes everything the site needs; the Source code files don't and won't run on their own." \
            --generate-notes \
            $prerelease
