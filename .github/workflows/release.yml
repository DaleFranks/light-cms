# Builds the Light CMS download whenever a version tag (such as v1.0.0) is pushed.
#
# The zip holds everything a site needs, including the vendor folder, so a site
# owner only has to unzip it and upload it. Tests run first, so a release is
# never built from broken code. Developer files are left out by the
# export-ignore lines in .gitattributes.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, intl, openssl, fileinfo, dom, xmlreader
          coverage: none

      - name: Run the tests
        run: |
          cp .env.example .env
          composer install --no-interaction --no-progress --prefer-dist
          php artisan key:generate
          php artisan test

      - name: Build the site folder
        run: |
          mkdir build
          git archive --format=tar --prefix=light-cms/ "$GITHUB_REF_NAME" | tar -x -C build
          cd build/light-cms
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Zip it
        run: |
          cd build
          zip -qr "../light-cms-$GITHUB_REF_NAME.zip" light-cms

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "light-cms-$GITHUB_REF_NAME.zip" \
            --title "Light CMS $GITHUB_REF_NAME" \
            --generate-notes
